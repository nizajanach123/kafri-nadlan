/* ---------- original music ---------- */
const POPS = [0, .3, .6, .9, 1.2, 2.4, 3.0, 4.8, 5.4, 6.0, 7.2, 7.8, 8.4, 9.6, 10.2, 10.8, 12.0, 12.6, 14.2, 15.0, 15.3, 17.4, 18.0, 18.6, 19.3, 19.8, 21.6, 22.2, 22.8, 25.2, 26.4, 27.6, 28.8, 31.2, 31.8, 33.6, 34.2, 34.8, 35.4, 36.6];
const CHORDS = [ // Am7, Fmaj7, Cmaj7, G6
  { pad: [220, 261.63, 329.63, 392], bass: 55, arp: [440, 523.25, 659.25, 783.99] },
  { pad: [174.61, 220, 261.63, 329.63], bass: 43.65, arp: [349.23, 440, 523.25, 659.25] },
  { pad: [261.63, 329.63, 392, 493.88], bass: 65.41, arp: [523.25, 659.25, 783.99, 987.77] },
  { pad: [196, 246.94, 293.66, 329.63], bass: 49, arp: [392, 493.88, 587.33, 659.25] }

async function renderMusic() {
  const oc = new OfflineAudioContext(2, Math.ceil(SR * (DUR + 1.2)), SR);

  const comp = oc.createDynamicsCompressor(); comp.threshold.value = -17; comp.knee.value = 12; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.2;
  master.connect(comp); comp.connect(oc.destination);

  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 3.3); }
  const verb = oc.createConvolver(); verb.buffer = ir; const vg = oc.createGain(); vg.gain.value = 0.34; verb.connect(vg); vg.connect(master);
  const dry = oc.createGain(); dry.connect(master); const send = oc.createGain(); send.connect(verb);
  const dl = oc.createDelay(1.5); dl.delayTime.value = BEAT * 0.75; const fb = oc.createGain(); fb.gain.value = 0.34; const dlp = oc.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2600;
  dl.connect(dlp); dlp.connect(fb); fb.connect(dl); const dg = oc.createGain(); dg.gain.value = 0.5; dlp.connect(dg); dg.connect(master); dg.connect(send);
  const nbuf = oc.createBuffer(1, SR, SR); { const d = nbuf.getChannelData(0); for (let i = 0; i < SR; i++) d[i] = Math.random() * 2 - 1; }

    const s = oc.createBufferSource(); s.buffer = nbuf; s.loop = true; const f = oc.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = oc.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur); const p = oc.createStereoPanner(); p.pan.value = pan;
    s.connect(f); f.connect(g); g.connect(p); p.connect(dry); if (toVerb) { const v = oc.createGain(); v.gain.value = toVerb; p.connect(v); v.connect(send); } s.start(t, Math.random()); s.stop(t + dur + 0.05);
  };
  const tone = ({ f, t, dur, type = 'sawtooth', gain = 0.1, a = 0.01, r = 0.2, lp = 2000, det = 0, pan = 0, verbAmt = 0.25 }) => {
    const o = oc.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det; const fl = oc.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp;
    const g = oc.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + a); g.gain.setValueAtTime(gain, t + Math.max(a, dur)); g.gain.linearRampToValueAtTime(0, t + dur + r);
    const p = oc.createStereoPanner(); p.pan.value = pan; o.connect(fl); fl.connect(g); g.connect(p); p.connect(dry);
    if (verbAmt) { const v = oc.createGain(); v.gain.value = verbAmt; p.connect(v); v.connect(send); } o.start(t); o.stop(t + dur + r + 0.05);
  };
  const pluck = (f, t, gain, pan) => {
    ['triangle', 'sawtooth'].forEach((type, i) => {
      const o = oc.createOscillator(); o.type = type; o.frequency.value = f; const fl = oc.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(5200, t); fl.frequency.exponentialRampToValueAtTime(900, t + 0.28);
      const g = oc.createGain(); const gg = gain * (i ? 0.35 : 1); g.gain.setValueAtTime(gg, t); g.gain.exponentialRampToValueAtTime(0.0008, t + 0.5);
      const p = oc.createStereoPanner(); p.pan.value = pan; o.connect(fl); fl.connect(g); g.connect(p); p.connect(dry);
      const v = oc.createGain(); v.gain.value = 0.3; p.connect(v); v.connect(send); const d2 = oc.createGain(); d2.gain.value = 0.55; p.connect(d2); d2.connect(dl); o.start(t); o.stop(t + 0.6);
    });
  };
  const kick = (t, gain = 0.95) => {
    const o = oc.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(155, t); o.frequency.exponentialRampToValueAtTime(46, t + 0.13);
    const g = oc.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4); o.connect(g); g.connect(dry); o.start(t); o.stop(t + 0.45); noise(t, 0.02, 'highpass', 2500, 0.7, gain * 0.25);
  };
  const clap = (t, gain = 0.34) => { for (let k = 0; k < 3; k++) noise(t + k * 0.011, k === 2 ? 0.16 : 0.03, 'bandpass', 1700, 0.8, gain, 0, k === 2 ? 0.25 : 0); };
  const hat = (t, gain = 0.07, open = false) => noise(t, open ? 0.12 : 0.035, 'highpass', 8200, 0.7, gain, (Math.random() - .5) * .4);
  const crash = (t, gain = 0.32) => { noise(t, 1.6, 'highpass', 4800, 0.6, gain, 0, 0.4); const o = oc.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(34, t + 0.9); const g = oc.createGain(); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.0); o.connect(g); g.connect(dry); o.start(t); o.stop(t + 1.1); };
  const riser = (t0, t1, gain = 0.2) => { const s = oc.createBufferSource(); s.buffer = nbuf; s.loop = true; const f = oc.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4; f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(7500, t1);
    const g = oc.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t1 - 0.05); g.gain.linearRampToValueAtTime(0, t1 + 0.02); s.connect(f); f.connect(g); g.connect(dry); const v = oc.createGain(); v.gain.value = 0.3; g.connect(v); v.connect(send); s.start(t0); s.stop(t1 + 0.1); };

  for (let b = 0; b < 16; b++) {
    const t0 = b * BAR, ch = CHORDS[b % 4], bright = b >= 5, breakdown = b === 13, last = b >= 14;
    // pad: two detuned saws per note
    ch.pad.forEach((f, i) => [-8, 8].forEach((det, j) => tone({ f, t: t0, dur: BAR - 0.05, type: 'sawtooth', gain: (b < 2 ? 0.016 : 0.026) * (breakdown ? 0.8 : 1), a: 0.5, r: 0.6, lp: bright ? 1900 : 1000, det, pan: (i - 1.5) * 0.28 + (j ? 0.15 : -0.15), verbAmt: 0.4 })));

    // drums
    for (let beat = 0; beat < 4; beat++) {
      const t = t0 + beat * BEAT;
      if (b <= 1) { if (beat % 2 === 0) kick(t, 0.32); }
      else if (b <= 4) { if (beat % 2 === 0 || (b === 4 && beat === 3)) kick(t, 0.8); if (beat % 2 === 1 && b >= 3) clap(t, 0.2); }
      else if (b <= 12 || last) { kick(t, 0.85); if (beat % 2 === 1) clap(t, 0.34); }
      else if (breakdown && beat === 0) kick(t, 0.6);
      if (b >= 2 && !breakdown) { hat(t + BEAT * 0.5, 0.06, beat === 3); if (b >= 5) { hat(t + BEAT * 0.25, 0.03); hat(t + BEAT * 0.75, 0.03); } }
    }
    // arp / plucks
    if ((b >= 5 && b <= 12) || last || breakdown) {
      const order = [0, 2, 1, 3, 2, 1, 3, 2];
      for (let i = 0; i < 8; i++) pluck(ch.arp[order[i]], t0 + i * BEAT * 0.5, breakdown ? 0.05 : 0.085, i % 2 ? 0.35 : -0.35);
    } else if (b >= 2 && b <= 4) for (let beat = 0; beat < 4; beat += 2) pluck(ch.arp[beat === 0 ? 0 : 2], t0 + beat * BEAT, 0.05, 0);
  }
  riser(10.8, 12.0, 0.22); for (let i = 0; i < 6; i++) clap(11.4 + i * 0.1, 0.12 + i * 0.05);   // build into the drop
  crash(12.0, 0.34); riser(33.0, 33.6, 0.18); crash(33.6, 0.36); kick(33.6, 1.0);
  POPS.forEach(t => tone({ f: 880, t, dur: 0.03, type: 'sine', gain: 0.035, a: 0.002, r: 0.06, lp: 6000, verbAmt: 0.2 }));
  const buf = await oc.startRendering();
  // gentle soft clip for loudness (a little drive), then normalise the peak
  const drive = 1.7, tn = Math.tanh(drive);
  for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = Math.tanh(d[i] * drive) / tn; }
  let peak = 0; for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  const k = peak > 0 ? 0.92 / peak : 1; for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] *= k; }

}
window.musicStats = async function () {
  const buf = await renderMusic(); window.__music = buf; const d = buf.getChannelData(0), out = { seconds: +buf.duration.toFixed(2), peakBefore: +window.__musicPeakBefore.toFixed(3), perSecondRms: [] };

};

/* ---------- encoding ---------- */
async function pickVideo() {
  for (const codec of ['avc1.640029', 'avc1.4d0029']) { try { const r = await VideoEncoder.isConfigSupported({ codec, width: W, height: H, bitrate: 7e6, framerate: FPS, avc: { format: 'avc' } }); if (r.supported) return codec; } catch (e) {} }
  return null;
}
window.startRender = async function () {
  window.__done = false; window.__err = null;
  try {
    const vcodec = await pickVideo(); if (!vcodec) throw new Error('no H.264 encoder');
    if (!(await AudioEncoder.isConfigSupported({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 160000 })).supported) throw new Error('no AAC encoder');
    log('composing music…'); const music = window.__music || await renderMusic(); window.__music = music;
    const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H }, audio: { codec: 'aac', numberOfChannels: 2, sampleRate: SR }, fastStart: 'in-memory' });
    const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { window.__err = 'video: ' + (e.message || e); } });
    venc.configure({ codec: vcodec, width: W, height: H, bitrate: 7_000_000, framerate: FPS, avc: { format: 'avc' } });
    const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => { window.__err = 'audio: ' + (e.message || e); } });
    aenc.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 160000 });
    const L = music.getChannelData(0), R = music.getChannelData(1), totalA = Math.round(DUR * SR); let aPtr = 0;
    const total = Math.round(DUR * FPS), t0 = performance.now();
    for (let i = 0; i < total; i++) {
      if (window.__err) throw new Error(window.__err);
      draw(i / FPS);
      const f = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) }); venc.encode(f, { keyFrame: i % FPS === 0 }); f.close();
      const end = Math.min(totalA, Math.round((i + 1) / FPS * SR));
      while (aPtr < end) { const n = Math.min(4800, end - aPtr), data = new Float32Array(n * 2); data.set(L.subarray(aPtr, aPtr + n), 0); data.set(R.subarray(aPtr, aPtr + n), n);

  } catch (e) { window.__err = String(e.message || e); log('ERROR ' + window.__err); }
};
window.saveToDesktop = async function (name) { const r = await fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: window.__buf }); return r.status + ' ' + await r.text(); };

(async function () {
  try {
    await Promise.all([400, 500, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 40px Heebo`, 'אבגדהוזחטיכלמנסעפצקרשת0123456789')));
    const [hero, logo, site, header] = await Promise.all([loadImg('hero-land.jpg'), loadImg('logo-light-hd.png'), loadImg('site-mobile.png'), loadImg('site-header.png')]);
    Object.assign(IM, { hero, logo, site, header });
    const q = new URLSearchParams(location.search); draw(q.has('t') ? parseFloat(q.get('t')) : 0); log(q.has('t') ? 'frame ' + q.get('t') : 'ready'); window.__ready = true;
